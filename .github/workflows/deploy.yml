name: Deploy to GitHub Pages

on:
  push:
    # `main` only. Feature branches must not publish: with several branches deploying, whichever
    # pushed last owned the live site, so unreviewed work could overwrite it mid-review. To
    # preview a branch, run this workflow manually against it from the Actions tab.
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, but never to write to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ required: scripts/build-catalog.mjs imports the app's TypeScript parser
      # directly and relies on Node's built-in type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `prebuild` regenerates the catalog from data/characters.csv and fails the job if the
      # CSV is invalid, so a bad edit can never reach the live site.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
